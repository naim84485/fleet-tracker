<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ড্রাইভার লোকেশন শেয়ার</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg:#0F172A;
    --surface:#16213A;
    --surface-2:#1E293B;
    --accent:#F59E0B;
    --text:#E2E8F0;
    --text-muted:#8CA0BE;
    --on:#10B981;
    --off:#EF4444;
    --border: rgba(148,163,184,0.15);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:radial-gradient(ellipse at top, #16213A 0%, #0F172A 60%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:32px 28px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:6px;
  }

  h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:32px;
    letter-spacing:0.01em;
    margin:0 0 24px 0;
    text-transform:uppercase;
  }

  label{
    display:block;
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:8px;
  }

  select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px;
    border-radius:10px;
    font-size:16px;
    font-family:'Inter',sans-serif;
    margin-bottom:20px;
    appearance:none;
    -webkit-appearance:none;
  }

  select:focus, button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    cursor:pointer;
    transition:transform 0.15s ease, opacity 0.15s ease;
  }

  button:active{ transform:scale(0.98); }

  #startBtn{ background:var(--accent); color:#1A1200; }
  #stopBtn{ background:transparent; border:1px solid var(--off); color:var(--off); display:none; }

  .status-row{
    margin-top:24px;
    padding-top:20px;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:10px;
  }

  .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--text-muted);
    flex-shrink:0;
  }
  .dot.live{
    background:var(--on);
    box-shadow:0 0 0 0 rgba(16,185,129,0.6);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(16,185,129,0.55);}
    70%{box-shadow:0 0 0 10px rgba(16,185,129,0);}
    100%{box-shadow:0 0 0 0 rgba(16,185,129,0);}
  }

  #statusText{ font-size:14px; color:var(--text-muted); }

  .coords{
    margin-top:16px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--text-muted);
    line-height:1.7;
  }
  .coords span{ color:var(--text); }

  .setup-note{
    margin-top:20px;
    font-size:12px;
    color:var(--off);
    line-height:1.6;
    display:none;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">ফ্লিট ট্র্যাকার · ড্রাইভার</div>
  <h1>লোকেশন শেয়ার</h1>

  <label for="driverSelect">আপনার নাম নির্বাচন করুন</label>
  <select id="driverSelect">
    <option value="">— নির্বাচন করুন —</option>
    <option value="driver1">ড্রাইভার ১</option>
    <option value="driver2">ড্রাইভার ২</option>
    <option value="driver3">ড্রাইভার ৩</option>
    <option value="driver4">ড্রাইভার ৪</option>
    <option value="driver5">ড্রাইভার ৫</option>
    <option value="driver6">ড্রাইভার ৬</option>
    <option value="driver7">ড্রাইভার ৭</option>
    <option value="driver8">ড্রাইভার ৮</option>
    <option value="driver9">ড্রাইভার ৯</option>
    <option value="driver10">ড্রাইভার ১০</option>
  </select>

  <button id="startBtn">শেয়ার শুরু করুন</button>
  <button id="stopBtn">শেয়ার বন্ধ করুন</button>

  <div class="status-row">
    <div class="dot" id="statusDot"></div>
    <div id="statusText">বন্ধ আছে</div>
  </div>

  <div class="coords" id="coords"></div>

  <div class="setup-note" id="setupNote">
    ⚠ firebaseConfig এখনও বসানো হয়নি। এই ফাইলের নিচে script অংশে আপনার Firebase প্রজেক্টের কনফিগারেশন বসান।
  </div>
</div>

<script>
  // ================================================================
  // এখানে আপনার নিজের Firebase প্রজেক্টের কনফিগারেশন বসান।
  // Firebase Console (console.firebase.google.com) > Project Settings > General
  // থেকে এই তথ্য পাবেন। এটা সম্পূর্ণ ফ্রি Spark plan-এ কাজ করবে।
  // ================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyBuu25ZYUGJWiayqzMTUavodF-rcMVFrCk",
    authDomain: "t-eran-2d426.firebaseapp.com",
    databaseURL: "https://t-eran-2d426-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "t-eran-2d426",
    storageBucket: "t-eran-2d426.firebasestorage.app",
    messagingSenderId: "256100312636",
    appId: "1:256100312636:web:5e2d234a8b9ffff2e20539",
    measurementId: "G-PMC6W971RS"
  };
  // ================================================================

  let db, watchId, driverId;
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const coordsEl = document.getElementById('coords');
  const driverSelect = document.getElementById('driverSelect');
  const setupNote = document.getElementById('setupNote');

  try{
    if(firebaseConfig.apiKey.includes('PASTE')){
      setupNote.style.display = 'block';
      statusText.textContent = 'সেটআপ বাকি আছে';
    } else {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    }
  }catch(e){
    console.error(e);
  }

  startBtn.addEventListener('click', () => {
    driverId = driverSelect.value;
    if(!driverId){
      alert('আগে আপনার নাম নির্বাচন করুন।');
      return;
    }
    if(!db){
      alert('Firebase কনফিগারেশন এখনও বসানো হয়নি।');
      return;
    }
    if(!navigator.geolocation){
      alert('এই ব্রাউজারে লোকেশন সাপোর্ট নেই।');
      return;
    }

    driverSelect.disabled = true;
    startBtn.style.display = 'none';
    stopBtn.style.display = 'block';
    statusDot.classList.add('live');
    statusText.textContent = 'লাইভ শেয়ার হচ্ছে...';

    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        db.ref('drivers/' + driverId).set({
          lat: latitude,
          lng: longitude,
          accuracy: Math.round(accuracy),
          updatedAt: Date.now(),
          name: driverSelect.options[driverSelect.selectedIndex].text
        });
        coordsEl.innerHTML =
          'অক্ষাংশ: <span>' + latitude.toFixed(6) + '</span><br>' +
          'দ্রাঘিমাংশ: <span>' + longitude.toFixed(6) + '</span><br>' +
          'নির্ভুলতা: <span>±' + Math.round(accuracy) + ' মি.</span>';
      },
      (err) => {
        statusText.textContent = 'ত্রুটি: ' + err.message;
        statusDot.classList.remove('live');
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
  });

  stopBtn.addEventListener('click', () => {
    if(watchId) navigator.geolocation.clearWatch(watchId);
    if(db && driverId){
      db.ref('drivers/' + driverId + '/updatedAt').set(0);
    }
    driverSelect.disabled = false;
    startBtn.style.display = 'block';
    stopBtn.style.display = 'none';
    statusDot.classList.remove('live');
    statusText.textContent = 'বন্ধ আছে';
    coordsEl.innerHTML = '';
  });
</script>

</body>
</html>
